# Checks the Go dependencies and the standard library for known
# vulnerabilities (ROUTE_SPEC.md section 15). It runs on every push and pull
# request, and weekly, because new advisories appear for code that has not
# changed.
#
# govulncheck fails the job only when the code actually calls the vulnerable
# function. Advisories in a module that is required but never called are listed
# and do not fail it.
#
# NOT YET RUN. This file has not been executed on GitHub. The same commands ran
# locally in the build container and passed.
#
# There is no npm audit step: the dashboard has no npm dependencies. It loads
# MapLibre from unpkg, pinned to an exact version with a Subresource Integrity
# hash, so a changed file there is refused by the browser.
name: security

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The version the Dockerfiles build with. A vulnerability in the standard
      # library is fixed by moving this forward, and govulncheck reports it
      # against whatever Go is installed here.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Check that downloaded modules match go.sum
        run: go mod verify

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
